    OperationalEvent:
      type: object
      description: Serializer for immutable operational events.
      properties:
        id:
          type: integer
          readOnly: true
        event_type:
          allOf:
          - $ref: '#/components/schemas/OperationalEventEventTypeEnum'
          readOnly: true
        severity:
          allOf:
          - $ref: '#/components/schemas/SeverityEnum'
          readOnly: true
        shipment:
          type: integer
          readOnly: true
          nullable: true
        actor:
          type: integer
          readOnly: true
          nullable: true
        actor_email:
          type: string
          readOnly: true
        source:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        payload:
          readOnly: true
        idempotency_key:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - actor_email
      - created_at
      - description
      - event_type
      - id
      - idempotency_key
      - payload
      - severity
      - shipment
      - source
      - title
    OperationalEventEventTypeEnum:
      enum:
      - ROUTE_DEVIATION
      - ETA_DELAY
      - HIGH_OPERATIONAL_RISK
      - INCIDENT_REPORTED
      - FUEL_RISK
      - HIGH_MARKET_PRESSURE
      - STALE_GPS
      - AUTOMATION_RECOMMENDATION
      - AUTOMATION_APPROVAL_REQUIRED
      - AUTOMATION_EXECUTED
      - SHIPMENT_STATUS_CHANGED
      - PAYMENT_EVENT
      - SYSTEM_ALERT
      type: string
      description: |-
        * `ROUTE_DEVIATION` - Route Deviation Detected
        * `ETA_DELAY` - ETA Arrival Delay Predicted
        * `HIGH_OPERATIONAL_RISK` - High Operational Risk Level
        * `INCIDENT_REPORTED` - Driver Incident Reported
        * `FUEL_RISK` - High Fuel Consumption Risk
        * `HIGH_MARKET_PRESSURE` - High Corridor Market Pressure
        * `STALE_GPS` - Stale GPS Telemetry Ping
        * `AUTOMATION_RECOMMENDATION` - Workflow Recommendation Created
        * `AUTOMATION_APPROVAL_REQUIRED` - Workflow Recommendation Requires Approval
        * `AUTOMATION_EXECUTED` - Workflow Recommendation Executed
        * `SHIPMENT_STATUS_CHANGED` - Shipment Status Transition
        * `PAYMENT_EVENT` - Freight Settlement / Payment Event
        * `SYSTEM_ALERT` - System Operational Alert
