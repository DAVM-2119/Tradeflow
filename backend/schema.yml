  /api/v1/analytics/automation/:
    get:
      operationId: v1_analytics_automation_retrieve
      description: 'GET: Retrieve automation workflow recommendation rates and execution
        metrics.'
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
          format: date-time
          nullable: true
      - in: query
        name: period
        schema:
          enum:
          - 1h
          - 6h
          - 24h
          - 7d
          - 30d
          - 90d
          - custom
          type: string
          default: 30d
          minLength: 1
        description: |-
          * `1h` - 1h
          * `6h` - 6h
          * `24h` - 24h
          * `7d` - 7d
          * `30d` - 30d
          * `90d` - 90d
          * `custom` - custom
      - in: query
        name: shipment_status
        schema:
          type: string
      - in: query
        name: start_date
        schema:
          type: string
          format: date-time
          nullable: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationAnalytics'
          description: ''
